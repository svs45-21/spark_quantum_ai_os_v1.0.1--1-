name: Spark Android companion

on:
  push:
    paths:
      - "spark_quantum_ai_os/android/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "spark_quantum_ai_os/android/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark_quantum_ai_os/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SPARK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spark.jks"
            echo "SPARK_KEYSTORE_PATH=$RUNNER_TEMP/spark.jks" >> "$GITHUB_ENV"
            echo "Using the stable signing key from repository secrets."
          else
            echo "No SPARK_KEYSTORE_BASE64 secret; the APK will be signed with a debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          SPARK_KEYSTORE_PASSWORD: ${{ secrets.SPARK_KEYSTORE_PASSWORD }}
          SPARK_KEY_ALIAS: ${{ secrets.SPARK_KEY_ALIAS }}
          SPARK_KEY_PASSWORD: ${{ secrets.SPARK_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Spark-companion.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Spark-companion-apk
          path: ${{ runner.temp }}/Spark-companion.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: spark_quantum_ai_os/android/app/build/reports/
