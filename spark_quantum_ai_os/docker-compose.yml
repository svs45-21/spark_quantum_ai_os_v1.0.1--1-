version: "3.9"

# SPARK QUANTUM AI OS — Docker Compose
# Usage:
#   docker compose up -d
#   docker compose logs -f spark
#   docker compose down

services:

  # ── SPARK Core API ────────────────────────────────────────────────────────
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark_os
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - spark_data:/spark/data
      - spark_logs:/spark/logs
      - ./.env:/spark/.env:ro
    environment:
      - SPARK_LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/spark
    depends_on:
      - redis
    networks:
      - spark_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Redis (short-term cache) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: spark_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spark_net

  # ── Ollama (local LLM) ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: spark_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - spark_net
    # GPU support (uncomment if you have NVIDIA GPU + nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  spark_data:
  spark_logs:
  redis_data:
  ollama_models:

networks:
  spark_net:
    driver: bridge
